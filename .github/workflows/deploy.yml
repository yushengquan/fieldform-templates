# GitHub Actions → Cloudflare Pages 自动部署
# 推送 main 分支后自动构建并发布。需要仓库 Secrets:
#   CLOUDFLARE_API_TOKEN   (权限: Cloudflare Pages: Edit)
#   CLOUDFLARE_ACCOUNT_ID
# 更简单的替代方案（无需本文件）：在 Cloudflare Pages 控制台直接连接 GitHub 仓库，
# 设置 构建命令 npm run build、输出目录 dist，即可自动部署。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/gen_templates.py
      - run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fieldform-templates
